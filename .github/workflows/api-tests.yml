name: twinfixeno application checks

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "compose.yaml"
      - ".env.example"
      - "infrastructure/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "compose.yaml"
      - ".env.example"
      - "infrastructure/**"
      - ".github/workflows/api-tests.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Start HAPI FHIR R4
        run: docker run --detach --name twinfixeno-hapi -p 8090:8080 hapiproject/hapi:v7.4.0
      - name: Wait for HAPI FHIR readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8090/fhir/metadata >/dev/null; then
              echo "HAPI FHIR R4 is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs twinfixeno-hapi
          exit 1
      - name: Run API and live FHIR tests
        env:
          DATABASE_URL: sqlite:///./ci-test.db
          AUTH_REQUIRED: "false"
          PYTHONPATH: ${{ github.workspace }}/services/api
          FHIR_BASE_URL: http://localhost:8090/fhir
          FHIR_INTEGRATION_TESTS: "1"
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js application
        run: npm run build

  compose-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load local example configuration
        run: cp .env.example .env
      - name: Validate Compose graph
        run: docker compose config --quiet
      - name: Build all application containers
        run: docker compose build api web
