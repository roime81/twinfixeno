name: twinfixeno application checks

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "compose.yaml"
      - ".env.example"
      - "infrastructure/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "compose.yaml"
      - ".env.example"
      - "infrastructure/**"
      - ".github/workflows/api-tests.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Start HAPI FHIR R4
        run: docker run --detach --name twinfixeno-hapi -p 8090:8080 hapiproject/hapi:v7.4.0
      - name: Wait for HAPI FHIR readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8090/fhir/metadata >/dev/null; then
              echo "HAPI FHIR R4 is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs twinfixeno-hapi
          exit 1
      - name: Run API and live FHIR tests
        env:
          DATABASE_URL: sqlite:///./ci-test.db
          AUTH_REQUIRED: "false"
          PYTHONPATH: ${{ github.workspace }}/services/api
          FHIR_BASE_URL: http://localhost:8090/fhir
          FHIR_INTEGRATION_TESTS: "1"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          pytest -q

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js application
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load local example configuration
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete stack
        run: docker compose up -d --build
      - name: Probe services and protected API boundary
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          checks = {
              "web": "http://127.0.0.1:3000/",
              "API readiness": "http://127.0.0.1:8000/health/ready",
              "API Prometheus metrics": "http://127.0.0.1:8000/metrics",
              "APISIX gateway": "http://127.0.0.1:9080/health",
              "Keycloak OIDC": "http://127.0.0.1:8081/realms/twinfixeno/.well-known/openid-configuration",
              "HAPI FHIR R4": "http://127.0.0.1:8090/fhir/metadata",
              "Ollama local model runtime": "http://127.0.0.1:11434/api/tags",
              "Qdrant vector store": "http://127.0.0.1:6333/collections",
              "Prometheus metrics server": "http://127.0.0.1:9090/-/ready",
              "Grafana dashboards": "http://127.0.0.1:3001/api/health",
              "Jaeger trace viewer": "http://127.0.0.1:16686/api/services",
          }
          pending = dict(checks)
          deadline = time.time() + 180
          while pending and time.time() < deadline:
              for name, url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=8) as response:
                          if response.status == 200:
                              print(f"PASS {name}: HTTP {response.status}", flush=True)
                              pending.pop(name)
                  except Exception as exc:
                      print(f"WAIT {name} ({url}): {exc}", flush=True)
              if pending:
                  time.sleep(5)
          if pending:
              raise SystemExit("Services did not become ready: " + ", ".join(pending))

          request = urllib.request.Request("http://127.0.0.1:9080/api/v1/patients")
          try:
              urllib.request.urlopen(request, timeout=8)
          except urllib.error.HTTPError as response:
              if response.code == 401:
                  print("PASS protected API: unauthenticated request rejected with HTTP 401")
              else:
                  raise SystemExit(f"Protected API returned unexpected HTTP {response.code}")
          else:
              raise SystemExit("Protected API accepted a request without a bearer token")

          import json
          initialize = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-03-26",
                  "capabilities": {},
                  "clientInfo": {"name": "twinfixeno-compose-smoke", "version": "1.0.0"},
              },
          }
          mcp_request = urllib.request.Request(
              "http://127.0.0.1:8001/mcp",
              data=json.dumps(initialize).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
              },
              method="POST",
          )
          with urllib.request.urlopen(mcp_request, timeout=15) as response:
              payload = response.read().decode("utf-8")
              if response.status != 200 or '"serverInfo"' not in payload:
                  raise SystemExit("MCP initialize handshake failed: " + payload[:500])
              print("PASS MCP Streamable HTTP initialize handshake")

          tools_list = {
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/list",
              "params": {},
          }
          list_request = urllib.request.Request(
              "http://127.0.0.1:8001/mcp",
              data=json.dumps(tools_list).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
              },
              method="POST",
          )
          with urllib.request.urlopen(list_request, timeout=15) as response:
              tool_payload = response.read().decode("utf-8")
              expected_tools = ["get_patient_timeline", "index_patient_evidence", "ask_patient_evidence"]
              missing_tools = [tool for tool in expected_tools if tool not in tool_payload]
              if response.status != 200 or missing_tools:
                  raise SystemExit("MCP tools/list failed; missing: " + ", ".join(missing_tools))
              print("PASS MCP tools/list exposes all three expected tools")

          unauthenticated_call = {
              "jsonrpc": "2.0",
              "id": 3,
              "method": "tools/call",
              "params": {
                  "name": "get_patient_timeline",
                  "arguments": {"patient_id": 1},
              },
          }
          call_request = urllib.request.Request(
              "http://127.0.0.1:8001/mcp",
              data=json.dumps(unauthenticated_call).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
              },
              method="POST",
          )
          with urllib.request.urlopen(call_request, timeout=15) as response:
              call_payload = response.read().decode("utf-8")
              if "Authenticated Keycloak bearer token required" not in call_payload:
                  raise SystemExit("MCP accepted or did not explicitly reject an unauthenticated tool call")
              print("PASS MCP tool call rejects missing bearer token")
          PY
      - name: Set up Node.js for browser E2E
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test packages
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser E2E workflows
        working-directory: apps/web
        env:
          CI: "true"
          PW_BASE_URL: http://localhost:3000
        run: npm run test:e2e
      - name: Collect container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
