name: twinfixeno application checks

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "compose.yaml"
      - "infrastructure/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "compose.yaml"
      - "infrastructure/**"
      - ".github/workflows/api-tests.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start HAPI FHIR R4
        run: docker run --detach --name twinfixeno-hapi -p 8090:8080 hapiproject/hapi:v7.4.0
      - name: Wait for HAPI FHIR readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8090/fhir/metadata >/dev/null; then
              echo "HAPI FHIR R4 is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs twinfixeno-hapi
          exit 1
      - name: Run API and live FHIR tests
        env:
          DATABASE_URL: sqlite:///./ci-test.db
          AUTH_REQUIRED: "false"
          PYTHONPATH: ${{ github.workspace }}/services/api
          FHIR_BASE_URL: http://localhost:8090/fhir
          FHIR_INTEGRATION_TESTS: "1"
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:9080
          NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8081
          NEXT_PUBLIC_KEYCLOAK_REALM: twinfixeno
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: twinfixeno-web
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build and start the complete stack
        run: docker compose up -d --build
      - name: Probe every public service and protected API boundary
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          checks = {
              "web": ("http://127.0.0.1:3000/", 200),
              "api readiness": ("http://127.0.0.1:8000/health/ready", 200),
              "gateway route": ("http://127.0.0.1:9080/health", 200),
              "Keycloak OIDC": ("http://127.0.0.1:8081/realms/twinfixeno/.well-known/openid-configuration", 200),
              "HAPI FHIR R4": ("http://127.0.0.1:8090/fhir/metadata", 200),
          }
          deadline = time.time() + 600
          pending = dict(checks)
          while pending and time.time() < deadline:
              for name, (url, expected) in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if response.status == expected:
                              print(f"PASS {name}: HTTP {response.status}")
                              pending.pop(name)
                  except Exception as exc:
                      print(f"WAIT {name}: {exc}")
              if pending:
                  time.sleep(5)
          if pending:
              raise SystemExit("Services did not become ready: " + ", ".join(pending))

          request = urllib.request.Request("http://127.0.0.1:9080/api/v1/patients")
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as response:
              if response.code == 401:
                  print("PASS protected API: unauthenticated request rejected with HTTP 401")
              else:
                  raise SystemExit(f"Protected API returned unexpected status {response.code}")
          else:
              raise SystemExit("Protected API accepted a request without a bearer token")
          PY
      - name: Collect container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
