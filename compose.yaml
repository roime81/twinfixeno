services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twinfixeno}
      POSTGRES_USER: ${POSTGRES_USER:-twinfixeno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twinfixeno} -d ${POSTGRES_DB:-twinfixeno}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-use}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infrastructure/keycloak/realm-twinfixeno.json:/opt/keycloak/data/import/realm-twinfixeno.json:ro
    ports: ["8081:8080"]
    networks: [internal]
  fhir:
    image: hapiproject/hapi:v7.4.0
    ports: ["8090:8080"]
    networks: [internal]
  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://twinfixeno:local-development-only@postgres:5432/twinfixeno}
      KEYCLOAK_ISSUER: http://localhost:8081/realms/twinfixeno
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/twinfixeno/protocol/openid-connect/certs
      JWT_AUDIENCE: twinfixeno-api
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      FHIR_BASE_URL: http://fhir:8080/fhir
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      fhir: {condition: service_started}
    ports: ["8000:8000"]
    networks: [internal]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:9080}
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8081
      NEXT_PUBLIC_KEYCLOAK_REALM: twinfixeno
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: twinfixeno-web
    depends_on: [api, keycloak]
    ports: ["3000:3000"]
    networks: [internal]
  apisix:
    image: apache/apisix:3.9.1-debian
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infrastructure/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports: ["9080:9080"]
    depends_on: [api]
    networks: [internal]
volumes:
  postgres_data:
networks:
  internal:
    driver: bridge
