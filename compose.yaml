services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twinfixeno}
      POSTGRES_USER: ${POSTGRES_USER:-twinfixeno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks: [internal]

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-password}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-use}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-password}
    volumes:
      - ./infrastructure/keycloak/realm-twinfixeno.json:/opt/keycloak/data/import/realm-twinfixeno.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    networks: [internal]

  keycloak-ready:
    image: curlimages/curl:8.12.1
    restart: "no"
    command: ["--fail", "--silent", "--show-error", "--retry", "90", "--retry-connrefused", "--retry-delay", "2", "--retry-max-time", "240", "http://keycloak:9000/health/ready"]
    depends_on:
      keycloak:
        condition: service_started
    networks: [internal]

  fhir-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: ${FHIR_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${FHIR_DB_PASSWORD:-local-fhir-password}
    volumes:
      - fhir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks: [internal]

  fhir:
    image: hapiproject/hapi:v7.4.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fhir-db:5432/hapi
      SPRING_DATASOURCE_USERNAME: ${FHIR_DB_USER:-hapi}
      SPRING_DATASOURCE_PASSWORD: ${FHIR_DB_PASSWORD:-local-fhir-password}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - ./infrastructure/fhir/application.yaml:/app/config/application.yaml:ro
    depends_on:
      fhir-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FHIR_PORT:-8090}:8080"
    networks: [internal]

  fhir-ready:
    image: curlimages/curl:8.12.1
    restart: "no"
    command: ["--fail", "--silent", "--show-error", "--retry", "120", "--retry-connrefused", "--retry-delay", "2", "--retry-max-time", "300", "http://fhir:8080/fhir/Patient?_count=1"]
    depends_on:
      fhir:
        condition: service_started
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    networks: [internal]

  qdrant-ready:
    image: curlimages/curl:8.12.1
    restart: "no"
    command: ["--fail", "--silent", "--show-error", "--retry", "90", "--retry-connrefused", "--retry-delay", "2", "--retry-max-time", "240", "http://qdrant:6333/collections"]
    depends_on:
      qdrant:
        condition: service_started
    networks: [internal]

  ollama:
    image: ollama/ollama:0.6.8
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [internal]

  ollama-models:
    image: ollama/ollama:0.6.8
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && ollama pull ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]

  mcp:
    build:
      context: ./services/mcp
    restart: unless-stopped
    environment:
      TWINFIXENO_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:${MCP_PORT:-8001}:8001"]
    networks: [internal]

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-twinfixeno}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-twinfixeno}}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8081/realms/twinfixeno}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/twinfixeno/protocol/openid-connect/certs}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-twinfixeno-api}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      ALLOW_USERNAME_PATIENT_GRANTS: ${ALLOW_USERNAME_PATIENT_GRANTS:-false}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-http://fhir:8080/fhir}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-ready:
        condition: service_completed_successfully
      fhir-ready:
        condition: service_completed_successfully
      ollama-models:
        condition: service_completed_successfully
      qdrant-ready:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [internal]

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:9080}
      WEB_KEYCLOAK_URL: ${WEB_KEYCLOAK_URL:-http://localhost:8081}
      WEB_KEYCLOAK_REALM: ${WEB_KEYCLOAK_REALM:-twinfixeno}
      WEB_KEYCLOAK_CLIENT_ID: ${WEB_KEYCLOAK_CLIENT_ID:-twinfixeno-web}
    depends_on:
      api:
        condition: service_healthy
      keycloak-ready:
        condition: service_completed_successfully
      apisix:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [internal]

  apisix:
    image: apache/apisix:3.9.1-debian
    restart: unless-stopped
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infrastructure/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:${APISIX_PORT:-9080}:9080"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks: [internal]

volumes:
  postgres_data:
  keycloak_postgres_data:
  fhir_postgres_data:
  ollama_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
